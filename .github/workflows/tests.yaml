name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every PHP version on the current MariaDB LTS; the newest PHP also on the
        # oldest maintained MariaDB LTS and on both maintained MySQL LTS lines.
        include:
          - php: '8.1'
            db: 'mariadb:12.3'
          - php: '8.2'
            db: 'mariadb:12.3'
          - php: '8.3'
            db: 'mariadb:12.3'
          - php: '8.4'
            db: 'mariadb:12.3'
          - php: '8.5'
            db: 'mariadb:12.3'
          - php: '8.5'
            db: 'mariadb:10.11'
          - php: '8.5'
            db: 'mysql:9.7'
          - php: '8.5'
            db: 'mysql:8.4'

    # No health check: the admin binary differs per image, and db-prepare waits for the server.
    services:
      db:
        image: ${{ matrix.db }}
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo_mysql

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Fresh schema, then the 0.44.1 schema plus every migration, then the diff of the two.
    - name: Prepare databases and diff the schemas
      env:
        DB_PASSWORD: root
      run: |
        composer db-prepare
        composer schema-diff

    - name: Check PHP code
      run: composer check-code

    - name: Run test suite
      run: composer test

#     - name: Run test suite
#       if: ${{ matrix.php != '8.1'}}
#       run: composer test-cov

#     - name: Run test suite (with coverage)
#       if: ${{ matrix.php == '8.1'}}
#       run: |
#         wget https://scrutinizer-ci.com/ocular.phar
#         composer test-cov
#         composer test-cov-upload

  # Runs once, on the newest PHP; the errors that existed when PHPStan was added are listed in phpstan-baseline.neon.
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run static analysis
      run: composer analyse

  # Single status for branch protection, so jobs and the PHP matrix can change without touching repository
  # settings. Every other job must be listed in its needs.
  tests-passed:
    name: Tests
    if: always()
    needs: [tests, static-analysis]
    runs-on: ubuntu-latest

    steps:
    - name: Check job results
      run: |
        test "${{ needs.tests.result }}" = "success"
        test "${{ needs.static-analysis.result }}" = "success"
