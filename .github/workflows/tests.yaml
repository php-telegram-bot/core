name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    services:
      mariadb:
        image: mariadb:10.3
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Verify MariaDB connection
      run: |
        while ! mysqladmin ping -h127.0.0.1 -P3306 --silent; do
          sleep 1
        done

    - name: Test migrations
      run: |
        git fetch origin 0.44.1 && git checkout FETCH_HEAD -- structure.sql
        mysql -h127.0.0.1 -P3306 -uroot -proot -e "create database telegrambot_migrations; use telegrambot_migrations; source structure.sql;"
        git checkout HEAD -- structure.sql
        mysql -h127.0.0.1 -P3306 -uroot -proot -e "create database telegrambot; use telegrambot; source structure.sql;"
        for SCHEMA_UPDATE_FILE in $(ls utils/db-schema-update); do mysql -h127.0.0.1 -P3306 -uroot -proot -e "use telegrambot_migrations; source utils/db-schema-update/${SCHEMA_UPDATE_FILE};"; done;

    - name: Install PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo_mysql

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check PHP code
      run: composer check-code

    - name: Run test suite
      run: composer test

#     - name: Run test suite
#       if: ${{ matrix.php != '8.1'}}
#       run: composer test-cov

#     - name: Run test suite (with coverage)
#       if: ${{ matrix.php == '8.1'}}
#       run: |
#         wget https://scrutinizer-ci.com/ocular.phar
#         composer test-cov
#         composer test-cov-upload

  # Single status for branch protection, so the PHP matrix can change without touching repository settings.
  tests-passed:
    name: Tests
    if: always()
    needs: tests
    runs-on: ubuntu-latest

    steps:
    - name: Check matrix result
      run: test "${{ needs.tests.result }}" = "success"
